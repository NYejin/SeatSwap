plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.seatswap'
version = '0.0.1-SNAPSHOT'

java { sourceCompatibility = '17' }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 로컬 실행(./gradlew bootRun) 시 backend/.env 파일이 있으면 자동으로 읽어 환경변수로 주입한다.
// Docker Compose는 이미 자체적으로 .env를 읽으므로 이 로직은 로컬 개발 편의용이다.
// .env 형식: KEY=VALUE, 한 줄에 하나, '#'로 시작하는 줄은 주석으로 무시.
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def idx = trimmed.indexOf('=')
                def key = trimmed.substring(0, idx).trim()
                def value = trimmed.substring(idx + 1).trim()
                environment(key, value)
            }
        }
        doFirst { logger.lifecycle("backend/.env 파일을 읽어 환경변수로 주입했습니다.") }
    } else {
        doFirst { logger.lifecycle("backend/.env 파일이 없어 application.yml의 기본값을 사용합니다.") }
    }
}
