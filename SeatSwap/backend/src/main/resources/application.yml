server:
  port: ${SERVER_PORT:8080}
  # 좌석표 상세 응답(좌석 수천 개 JSON)을 줄이기 위한 응답 압축
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seatswap}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    # URL만으로 드라이버를 자동 추론하게 두지 않고 명시적으로 지정 (추론 실패 방지)
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 좌석표 이미지 업로드 상한 10MB (seatmap-service 상한과 동일). 기본값 1MB면 업로드가 막힌다
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    # 요청 전체에 영속성 컨텍스트를 열어두지 않는다. 응답 DTO는 서비스 트랜잭션 안에서 만들고,
    # 무결성 위반 레이스 후 재조회가 실패한 세션이 아닌 새 세션/트랜잭션에서 돌게 하기 위함.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration/V*.sql)만 변경한다. Hibernate는 엔티티와 일치하는지 검증만 한다.
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전부터 테이블이 있는 DB는 V1을 적용된 것으로 간주(baseline)하고 V2부터 적용한다
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  # 기본값은 로컬 개발이 당장 돌아가게 하기 위한 placeholder일 뿐이다.
  # HMAC-SHA는 최소 256비트(32바이트) 키가 필요하므로 일부러 충분히 길게 잡아뒀다.
  # 실제로는 반드시 JWT_SECRET 환경변수로 직접 생성한 값을 덮어써서 쓸 것
  # (예: openssl rand -base64 32).
  secret: ${JWT_SECRET:dev-only-insecure-default-secret-please-override-with-JWT-SECRET-env}
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 1209600000

seatmap-service:
  base-url: ${SEATMAP_SERVICE_URL:http://localhost:8001}
  # 미설정/빈 값이면 X-Internal-Key 헤더를 보내지 않는다 (seatmap-service 개발 모드). 운영은 양쪽에 같은 값을 설정
  internal-key: ${SEATMAP_INTERNAL_KEY:}
  # 인식은 외부 요청 + OCR로 최대 약 55초 걸릴 수 있어 읽기 타임아웃은 60초
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  # 이미지당 인식 비용이 커서 전역 동시 인식 수를 제한한다 (사용자당 동시 1건은 코드 고정). 대기 초과 시 503 BUSY
  max-concurrent-recognitions: 3
  permit-wait-ms: 5000
  # 인식 결과 좌석 수 상한 (seatmap-service 상한 6000과 동일). 넘으면 502
  max-seats: 6000
  # TEMP-DRAFT-DELETE (테스트용, 추후 제거 또는 비활성화): DELETE /api/seatmaps/{id}로 DRAFT 삭제. false면 404
  dev-draft-delete-enabled: ${SEATMAP_DEV_DRAFT_DELETE:true}
